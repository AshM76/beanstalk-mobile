<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beanstalk — Animated Logo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #F4FAF6;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Georgia', serif;
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: 480px;
    height: 620px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }

  svg#plant {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: 340px;
    height: 500px;
    overflow: visible;
  }

  /* ─── Wordmark ─────────────────────────────────────── */
  .wordmark {
    position: absolute;
    bottom: 18px;
    left: 0; right: 0;
    text-align: center;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .wordmark.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .wordmark h1 {
    font-family: 'Arial Black', 'Arial', sans-serif;
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 0.18em;
    color: #0F4C2A;
    text-transform: uppercase;
  }
  .wordmark p {
    font-family: 'Arial', sans-serif;
    font-size: 11px;
    letter-spacing: 0.22em;
    color: #5A8A6E;
    text-transform: uppercase;
    margin-top: 3px;
  }

  /* ─── SVG element base states ──────────────────────── */
  .soil-shadow {
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .seed {
    opacity: 0;
    transform-origin: 170px 478px;
    transition: opacity 0.4s ease, transform 0.5s ease;
  }
  .stalk-path {
    stroke-dasharray: 600;
    stroke-dashoffset: 600;
    transition: stroke-dashoffset 1.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  .stalk-highlight {
    stroke-dasharray: 600;
    stroke-dashoffset: 600;
    transition: stroke-dashoffset 1.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.08s;
  }
  .leaf-group {
    opacity: 0;
    transform-origin: var(--ox) var(--oy);
    transform: scale(0.05) rotate(var(--start-rot, 0deg));
    transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .leaf-group.visible {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }
  .coin-group {
    opacity: 0;
    transform-origin: var(--cx) var(--cy);
    transform: scale(0.1);
    transition: opacity 0.4s ease 0.15s, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s;
  }
  .coin-group.visible {
    opacity: 1;
    transform: scale(1);
  }

  /* ─── Gentle sway after growth ──────────────────────── */
  @keyframes sway {
    0%   { transform: rotate(0deg); }
    25%  { transform: rotate(1.2deg); }
    75%  { transform: rotate(-1.2deg); }
    100% { transform: rotate(0deg); }
  }
  @keyframes float-coin {
    0%   { transform: translateY(0px); }
    50%  { transform: translateY(-3px); }
    100% { transform: translateY(0px); }
  }
  @keyframes shimmer-leaf {
    0%   { opacity: 0.12; }
    50%  { opacity: 0.28; }
    100% { opacity: 0.12; }
  }
  @keyframes pulse-glow {
    0%   { r: 0; opacity: 0.6; }
    100% { r: 28px; opacity: 0; }
  }
  .swaying {
    animation: sway 4s ease-in-out infinite;
    transform-origin: 170px 478px;
  }
  .floating-coin {
    animation: float-coin 2.8s ease-in-out infinite;
  }
  .leaf-shimmer {
    animation: shimmer-leaf 3s ease-in-out infinite;
  }

  /* ─── Particle seeds ──────────────────────────────── */
  .sparkle {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #F5C842;
    pointer-events: none;
    opacity: 0;
  }

  /* ─── Replay button ─────────────────────────────── */
  .replay-btn {
    position: absolute;
    bottom: -42px;
    left: 50%;
    transform: translateX(-50%);
    background: none;
    border: 1.5px solid #1B8C4E;
    color: #1B8C4E;
    padding: 6px 20px;
    border-radius: 20px;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.5s ease, background 0.2s ease, color 0.2s ease;
  }
  .replay-btn:hover {
    background: #1B8C4E;
    color: white;
  }
  .replay-btn.visible { opacity: 1; }
</style>
</head>
<body>

<script>
// ─── Utility ────────────────────────────────────────────
const el = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));

function setStalkProgress(pct) {
  const total = 600;
  const offset = total * (1 - Math.min(pct, 1));
  ['stalk-shadow','stalk-main','stalk-hl'].forEach(id => {
    el(id).style.strokeDashoffset = offset;
  });
}

function showNode(n) {
  el('node'+n).style.opacity = '1';
  el('node'+n).style.transition = 'opacity 0.3s ease';
}

function showLeaf(n) {
  el('leaf'+n).classList.add('visible');
}

function showCoin(n) {
  el('coin'+n).classList.add('visible');
}

// ─── Gold particle burst ─────────────────────────────────
function burst(x, y, count=8) {
  const stage = el('stage');
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'sparkle';
    const angle = (Math.PI*2/count)*i + Math.random()*0.5;
    const dist = 22 + Math.random()*18;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist;
    p.style.left = (x - 3)+'px';
    p.style.top  = (y - 3)+'px';
    stage.appendChild(p);
    p.animate([
      { opacity: 1, transform: 'translate(0,0) scale(1)' },
      { opacity: 0, transform: `translate(${dx}px,${dy}px) scale(0.3)` }
    ], { duration: 600, easing: 'ease-out', delay: Math.random()*100 })
      .onfinish = () => p.remove();
  }
}

// ─── Coin positions on stage for burst (approx) ─────────
const coinBurstPos = [
  [294, 248], // coin1 (right, bottom)
  [148, 310], // coin2 (left)
  [300, 173], // coin3 (right)
  [140, 113], // coin4 (left)
  [292,  54], // coin5 (right)
  [147,   0], // coin6 (left, top)
];

// ─── Main animation sequence ─────────────────────────────
async function runAnimation() {
  // Reset everything
  el('replayBtn').classList.remove('visible');
  el('wordmark').classList.remove('visible');
  el('tip-bud').style.opacity = '0';
  el('soil').style.opacity = '0';
  const seedGroup = el('seed-group');
  seedGroup.style.opacity = '0';
  seedGroup.style.transform = 'scale(1) rotate(0deg)';
  setStalkProgress(0);
  for (let n=1;n<=6;n++) {
    el('node'+n).style.opacity = '0';
    el('leaf'+n).classList.remove('visible');
    el('coin'+n).classList.remove('visible');
  }
  const plant = el('plant');
  plant.classList.remove('swaying');
  document.querySelectorAll('.floating-coin').forEach(c=>c.classList.remove('floating-coin'));

  await wait(400);

  // 1. Soil materialises
  el('soil').style.opacity = '1';
  await wait(500);

  // 2. Seed appears
  seedGroup.style.opacity = '1';
  await wait(700);

  // 3. Seed "cracks" — scale pulse
  seedGroup.style.transform = 'scale(1.3) rotate(-8deg)';
  await wait(200);
  seedGroup.style.transform = 'scale(0.85) rotate(4deg)';
  await wait(150);
  seedGroup.style.transform = 'scale(1) rotate(0deg)';
  await wait(300);

  // 4. Stalk grows
  // Animate in stages so nodes pop at right time
  const stalkDuration = 1600; // ms total
  const stepMs = 40;
  const steps = stalkDuration / stepMs;
  const nodeAt = [0.20, 0.38, 0.56, 0.72, 0.85, 0.95];
  let nodeShown = [false,false,false,false,false,false];

  for (let i=0; i<=steps; i++) {
    const pct = i/steps;
    setStalkProgress(pct);
    // Pop nodes at threshold
    for (let n=0;n<6;n++) {
      if (!nodeShown[n] && pct >= nodeAt[n]) {
        showNode(n+1);
        nodeShown[n] = true;
      }
    }
    if (i < steps) await wait(stepMs);
  }

  // Tip bud appears
  el('tip-bud').style.transition = 'opacity 0.4s ease';
  el('tip-bud').style.opacity = '1';
  await wait(400);

  // Seed fades as stalk rises
  seedGroup.style.transition = 'opacity 0.6s ease';
  seedGroup.style.opacity = '0';

  // 5. Leaves appear one by one with coins
  const leafDelay = 420;
  const coinDelay = 300;

  for (let n=1; n<=6; n++) {
    await wait(leafDelay);
    showLeaf(n);
    await wait(coinDelay);
    showCoin(n);
    // Burst sparkle at coin position
    const [bx, by] = coinBurstPos[n-1];
    // map SVG coords to stage coords (approx: SVG 340px wide, offset left 50%)
    const svgEl = el('plant');
    const svgRect = svgEl.getBoundingClientRect();
    const stageRect = el('stage').getBoundingClientRect();
    const scaleX = svgRect.width / 340;
    const scaleY = svgRect.height / 500;
    const px = (svgRect.left - stageRect.left) + bx * scaleX;
    const py = (svgRect.top  - stageRect.top)  + by * scaleY;
    burst(px, py, 7);
  }

  await wait(600);

  // 6. Wordmark appears
  el('wordmark').classList.add('visible');

  await wait(800);

  // 7. Idle animations begin
  plant.classList.add('swaying');
  document.querySelectorAll('.coin-group.visible').forEach((c,i) => {
    c.style.animation = `float-coin ${2.4 + i*0.25}s ease-in-out infinite`;
    c.style.animationDelay = `${i * 0.18}s`;
  });

  await wait(1200);
  el('replayBtn').classList.add('visible');
}

// ─── Start on load ──────────────────────────────────────
window.addEventListener('load', () => {
  setTimeout(runAnimation, 300);
});
</script>
</body>
</html>
