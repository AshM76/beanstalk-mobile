<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <defs>
    <clipPath id="headClip">
      <ellipse cx="100" cy="88" rx="47" ry="53"/>
    </clipPath>
  </defs>

  <!--
    HEAD: cx=100 cy=88 rx=47 ry=53
          top=35  bottom=141  left=53  right=147

    Cuff bottom = y=90   ← face starts here
    Chin        = y=141
    Face height = 51px

    Eyebrows  y=98   (8px below cuff)
    Eyes      y=108  (10px below brows)
    Nose tip  y=121  (13px below eyes)
    Mouth     y=132  (11px below nose)
    Chin      y=141  (9px below mouth)
  -->

  <!-- SHOULDERS -->
  <path d="M20 240 Q26 196 52 182 Q75 170 100 169 Q125 170 148 182 Q174 196 180 240Z" fill="#4A6330"/>
  <path d="M83 177 Q100 194 117 177" stroke="#3A5228" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- NECK -->
  <rect x="89" y="135" width="22" height="16" rx="5" fill="#B87030"/>

  <!-- HEAD skin -->
  <ellipse cx="100" cy="88" rx="47" ry="53" fill="#C07A3A"/>

  <!-- EARS -->
  <ellipse cx="53"  cy="92" rx="6"   ry="7.5" fill="#C07A3A"/>
  <ellipse cx="147" cy="90" rx="7"   ry="8.5" fill="#C07A3A"/>
  <ellipse cx="53"  cy="92" rx="3.2" ry="4.5" fill="#A86828"/>
  <ellipse cx="147" cy="90" rx="3.8" ry="5.5" fill="#A86828"/>

  <!-- BEANIE DOME — charcoal, clipped to head -->
  <rect x="50" y="30" width="100" height="58"
        fill="#232323" clip-path="url(#headClip)"/>

  <!-- BEANIE CUFF — slightly lighter band -->
  <rect x="50" y="78" width="100" height="14"
        fill="#2D2D2D" clip-path="url(#headClip)"/>

  <!-- Knit rib lines on cuff -->
  <line x1="66"  y1="78" x2="66"  y2="92" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="73"  y1="78" x2="73"  y2="92" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="80"  y1="78" x2="80"  y2="92" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="87"  y1="78" x2="87"  y2="92" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="94"  y1="78" x2="94"  y2="92" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="101" y1="78" x2="101" y2="92" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="108" y1="78" x2="108" y2="92" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="115" y1="78" x2="115" y2="92" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="122" y1="78" x2="122" y2="92" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="129" y1="78" x2="129" y2="92" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="136" y1="78" x2="136" y2="92" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Beanstalk logo on cuff -->
  <line x1="100" y1="91" x2="100" y2="81" stroke="#4CAF50" stroke-width="2" stroke-linecap="round"/>
  <path d="M100 87 Q93 83 91 78 Q96 81 100 85Z" fill="#4CAF50"/>
  <path d="M100 85 Q107 81 110 76 Q105 79 100 84Z" fill="#66BB6A"/>
  <circle cx="100" cy="80" r="2" fill="#81C784"/>

  <!-- Hair wisps below cuff -->
  <path d="M57 91 Q49 102 52 115" stroke="#1E0E06" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M143 90 Q151 101 148 114" stroke="#1E0E06" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- ══ FACE ══ -->

  <!-- EYEBROWS  y=98 -->
  <path d="M72 100 Q82 95 92 99"    stroke="#1E0E06" stroke-width="3"  fill="none" stroke-linecap="round"/>
  <path d="M108 98 Q119 93 130 98"  stroke="#1E0E06" stroke-width="3"  fill="none" stroke-linecap="round"/>

  <!-- LEFT EYE  centre y=109 -->
  <path d="M72 109 Q82 101 93 109 Q82 117 72 109Z" fill="white"/>
  <ellipse cx="82"  cy="109" rx="5"   ry="5.5" fill="#3A7D44"/>
  <ellipse cx="82"  cy="109" rx="2.8" ry="3"   fill="#152B18"/>
  <circle  cx="84"  cy="107" r="1.4" fill="white"/>
  <path d="M72 109 Q82 101 93 109" stroke="#1E0E06" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M73 110 Q82 117 92 110" stroke="#1E0E06" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- RIGHT EYE  centre y=109 -->
  <path d="M108 109 Q120 100 131 109 Q120 118 108 109Z" fill="white"/>
  <ellipse cx="120" cy="109" rx="5.8" ry="6"   fill="#3A7D44"/>
  <ellipse cx="120" cy="109" rx="3.2" ry="3.4" fill="#152B18"/>
  <circle  cx="122" cy="107" r="1.5" fill="white"/>
  <path d="M108 109 Q120 100 131 109" stroke="#1E0E06" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M109 110 Q120 118 130 110" stroke="#1E0E06" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- NOSE  y=121–128 -->
  <path d="M101 120 Q103 125 103 128" stroke="#A86828" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M98 128 Q101 132 106 129"  stroke="#A86828" stroke-width="2"   fill="none" stroke-linecap="round"/>

  <!-- MOUTH  y=132 -->
  <path d="M87 132 Q100 143 114 133" stroke="#6B3010" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M91 137 Q100 143 110 138" stroke="#A86828" stroke-width="1"   fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Cheeks -->
  <ellipse cx="74"  cy="120" rx="10" ry="6" fill="#C05028" opacity="0.18"/>
  <ellipse cx="129" cy="120" rx="10" ry="6" fill="#C05028" opacity="0.18"/>

</svg>
