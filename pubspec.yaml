name: beanstalk
description: Learn investing, trade virtually, compete with friends

publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: ^1.2.0
  dio: ^5.4.0

  # State & Storage
  shared_preferences: ^2.2.2

  # Charts
  fl_chart: ^0.66.2

  # Images
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1

  # UI
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9

  # Icons & Splash
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10

  # Misc
  intl: ^0.19.0
  url_launcher: ^6.2.5
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter_native_splash:
  color: "#2E7D32"
  color_dark: "#2E7D32"
  image: assets/icon/icon.png
  image_dark: assets/icon/icon.png
  android: false
  ios: true
  fullscreen: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/cash/
    - assets/icon/